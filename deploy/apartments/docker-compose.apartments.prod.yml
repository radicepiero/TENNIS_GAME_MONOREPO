services:
  apartments-ui:
    image: nginx:1.27-alpine
    container_name: apartments-ui
    restart: unless-stopped
    volumes:
      - ../../services/apartments/ui:/usr/share/nginx/html:ro
    expose:
      - "80"
    networks:
      - tennis_net

networks:
  tennis_net:
    external: true
    name: tennis_game_monorepo_tennis_net
