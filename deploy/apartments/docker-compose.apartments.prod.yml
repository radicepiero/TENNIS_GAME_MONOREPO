services:
  apartments-ui:
    build:
      context: ../../services/apartments/ui
    container_name: apartments-ui
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - tennis_net

  apartments-api:
    build:
      context: ../../services/apartments/api
    container_name: apartments-api
    restart: unless-stopped
    environment:
      - PORT=9100
    expose:
      - "9100"
    networks:
      - tennis_net

networks:
  tennis_net:
    external: true
    name: tennis_game_monorepo_tennis_net
