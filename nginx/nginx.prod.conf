events {}

http {
  upstream tennis_ui {
    server ui:3000;
  }

  upstream tennis_api {
    server api:9000;
  }

  server {
    listen 80;
    server_name popostapo.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://www.popostapo.com$request_uri;
    }
  }

  server {
    listen 80;
    server_name www.popostapo.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name popostapo.com;

    ssl_certificate /etc/letsencrypt/live/www.popostapo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.popostapo.com/privkey.pem;

    location / {
      return 301 https://www.popostapo.com$request_uri;
    }
  }

  server {
    listen 443 ssl;
    server_name www.popostapo.com;

    ssl_certificate /etc/letsencrypt/live/www.popostapo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.popostapo.com/privkey.pem;

    # API
    location = /api {
      proxy_pass http://tennis_api/api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://tennis_api/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # UI
    location / {
      proxy_pass http://tennis_ui;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
