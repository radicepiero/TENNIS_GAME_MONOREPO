<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apartments</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #0b1220;
        --card: rgba(255, 255, 255, 0.08);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.70);
        --accent: #7dd3fc;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
        background: radial-gradient(1200px 600px at 20% 20%, #1a2b55 0%, var(--bg) 45%),
          radial-gradient(900px 500px at 80% 10%, #164e63 0%, transparent 50%),
          var(--bg);
        color: var(--text);
      }

      .card {
        width: min(720px, calc(100% - 32px));
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 18px;
        padding: 28px 26px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(10px);
      }

      h1 {
        font-size: 28px;
        margin: 0 0 10px;
        letter-spacing: 0.2px;
      }

      p {
        margin: 10px 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
        margin-top: 18px;
      }

      .pill {
        display: inline-block;
        border: 1px solid rgba(125, 211, 252, 0.45);
        color: var(--text);
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        letter-spacing: 0.2px;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
          "Courier New", monospace;
        color: rgba(255, 255, 255, 0.9);
      }

      @media (min-width: 720px) {
        .grid {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>

  <body>
    <main class="card">
      <span class="pill">popostapo.com • apartments</span>
      <h1>Apartments</h1>
      <p>
        Pagina di test per verificare il routing Nginx su
        <code>apartments.popostapo.com</code>.
      </p>
      <div class="grid">
        <p><strong>Stato</strong><br />UI container: <code>OK</code></p>
        <p><strong>Prossimi step</strong><br />TLS + API + login</p>
      </div>
    </main>
  </body>
</html>
