<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/classifica.css" />
    <title>Evoluzione della classifica</title>
  </head>
  <body>
    <h1>Evoluzione della classifica dei primi 100 tennisti</h1>
    <div class="table-container">
      <table id="rankingTable">
        <thead>
          <tr id="datesHeader">
            <th>Rank</th>
            <!-- Date headers will be inserted by JavaScript -->
          </tr>
        </thead>
        <tbody id="rankingBody">
          <!-- Rows will be generated by JavaScript -->
        </tbody>
      </table>
    </div>

    <script type="module">
      import { Ranking } from "/js/Ranking.js";

      function generateRankingTable(data) {
        console.log(!Array.isArray(data));
        if (!Array.isArray(data)) {
          console.error("Invalid data format. Expected an array.");
          return;
        }

        // Normalize and sort dates
        // 1. Estrai e formatta tutte le date valide
        const allDates = data
          .map((item) => item.date && formatDate(item.date))
          .filter(Boolean);

        // 2. Rimuovi duplicati creando un Set
        const uniqueDates = new Set(allDates);

        // 3. Converti in array e ordina
        const dates = Array.from(uniqueDates).sort(
          (a, b) => new Date(a) - new Date(b)
        );

        if (dates.length === 0) {
          console.error("No valid dates found in the data.");
          return;
        }

        // Create optimized data structure: Map { date => Map { rank => player } }
        const rankingMap = new Map();
        data.forEach((item) => {
          if (!item.date || !item.ranking) return;

          const dateStr = formatDate(item.date);
          if (!dateStr) return;

          if (!rankingMap.has(dateStr)) {
            rankingMap.set(dateStr, new Map());
          }
          rankingMap.get(dateStr).set(item.ranking, item.player_name);
        });

        // Clear previous table headers
        const datesHeader = document.getElementById("datesHeader");
        while (datesHeader.children.length > 1) {
          datesHeader.removeChild(datesHeader.lastChild);
        }

        // Create document fragment for headers
        const headerFragment = document.createDocumentFragment();
        dates.forEach((date) => {
          const th = document.createElement("th");
          th.className = "date-header";
          th.textContent = date;
          headerFragment.appendChild(th);
        });
        datesHeader.appendChild(headerFragment);

        // Generate table rows (ranks 1-100)
        const tbody = document.getElementById("rankingBody");
        tbody.innerHTML = ""; // Clear existing rows

        const rowFragment = document.createDocumentFragment();

        for (let rank = 1; rank <= 100; rank++) {
          const row = document.createElement("tr");

          // Rank column
          const rankCell = document.createElement("td");
          rankCell.textContent = rank;
          rankCell.className = "rank-col";
          row.appendChild(rankCell);

          // Player cells for each date
          dates.forEach((date) => {
            const cell = document.createElement("td");
            cell.className = "player-cell";
            const playersForDate = rankingMap.get(date);
            cell.textContent = playersForDate?.get(rank) || "-";

            // Optional: Add data attributes for easier debugging
            cell.dataset.date = date;
            cell.dataset.rank = rank;

            row.appendChild(cell);
          });

          rowFragment.appendChild(row);
        }

        tbody.appendChild(rowFragment);
      }

      // Helper function with better date validation
      function formatDate(dateInput) {
        if (!dateInput) return null;

        try {
          const date = new Date(dateInput);
          return isNaN(date.getTime())
            ? null
            : date.toISOString().split("T")[0];
        } catch (e) {
          console.warn(`Invalid date: ${dateInput}`);
          return null;
        }
      }

      // Initialize the table when the page loads
      document.addEventListener("DOMContentLoaded", async () => {
        const rankingData = await Ranking.query({
          ranking_min: 1,
          ranking_max: 100,
        });
        generateRankingTable(rankingData);
      });
    </script>
  </body>
</html>
