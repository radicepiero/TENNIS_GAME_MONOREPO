<!DOCTYPE html>
<html>
  <head>
    <title>Pagina con modulo PennaDialogo</title>
  </head>
  <body>
    <button id="apriDialogoBtn">Apri selezione paesi</button>
    <div id="risultato"></div>

    <!-- Contenitore per la finestra di dialogo -->
    <div id="dialogContainer"></div>

    <script type="module" src="app.js"></script>
    <script type="module">
      const apiUrl = "/api/";
      import { Tournament } from "/js/Tournament.js";
      const tournament = (await Tournament.fetchTournament(5, apiUrl)).data[0];
      import Player from "/js/Player.js";
      const players = await Player.fetchByTournament(tournament, apiUrl);
      import { PennaDialogo } from "../js/pennaDialogo.js";
      // Inizializza la finestra di dialogo
      const dialog = new PennaDialogo("#dialogContainer", {
        options: players,
      });

      // Aggiungi evento al bottone
      document
        .getElementById("apriDialogoBtn")
        .addEventListener("click", () => {
          dialog.open();
        });
    </script>
  </body>
</html>
